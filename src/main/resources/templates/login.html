<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Entrar no Lynotes</h1>

                        <div class="alert alert-info">
                            Acesso provisório: <strong>admin</strong> / <strong>123456</strong>
                        </div>

                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" action="/login">
                            <div class="mb-3">
                                <label class="form-label" for="usuario">Usuário</label>
                                <input class="form-control" id="usuario" name="usuario"
                                       th:value="${usuarioInformado}" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="senha">Senha</label>
                                <input class="form-control" id="senha" name="senha"
                                       type="password" required>
                            </div>

                            <button class="btn btn-primary w-100" type="submit">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
