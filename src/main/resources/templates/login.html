<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold text-purple mb-1">Entrar no Lynotes</h1>
                            <p class="text-muted small">Acesse o seu catálogo pessoal e social</p>
                        </div>

                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" action="/login">
                            <div class="mb-3">
                                <label class="form-label" for="usuario">Usuário / E-mail</label>
                                <input class="form-control" id="usuario" name="usuario"
                                       th:value="${usuarioInformado}" required autofocus
                                       placeholder="exemplo@email.com">
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="senha">Senha</label>
                                <input class="form-control" id="senha" name="senha"
                                       type="password" required
                                       placeholder="Sua senha secreta">
                            </div>

                            <button class="btn btn-primary w-100 btn-lg mb-3" type="submit">Entrar</button>
                        </form>
                        <div class="text-center">
                            <a href="/" class="text-purple small">← Voltar para a tela inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
