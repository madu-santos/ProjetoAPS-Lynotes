<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #000000;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4 border-0" style="background-color: #121212; border: 1px solid #282828;">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold text-purple mb-1">Entrar no Lynotes</h1>
                            <p class="text-secondary small">Acesse o seu catálogo pessoal e social</p>
                        </div>

                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" action="/login">
                            <!-- Input Usuário / Email com Ícone -->
                            <div class="mb-3">
                                <label class="form-label text-white" for="usuario">Usuário / E-mail</label>
                                <div class="position-relative">
                                    <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary">
                                        <i class="bi bi-person fs-5"></i>
                                    </span>
                                    <input class="form-control bg-dark text-light border-secondary ps-5" id="usuario" name="usuario"
                                           th:value="${usuarioInformado}" required autofocus
                                           placeholder="exemplo@email.com">
                                </div>
                            </div>

                            <!-- Input Senha com Ícone -->
                            <div class="mb-4">
                                <label class="form-label text-white" for="senha">Senha</label>
                                <div class="position-relative">
                                    <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary">
                                        <i class="bi bi-lock fs-5"></i>
                                    </span>
                                    <input class="form-control bg-dark text-light border-secondary ps-5" id="senha" name="senha"
                                           type="password" required
                                           placeholder="Sua senha secreta">
                                </div>
                            </div>

                            <button class="btn btn-purple w-100 btn-lg mb-3 fw-bold" type="submit">Entrar</button>
                        </form>

                        <div class="text-center mt-2 mb-3">
                            <span class="text-secondary small">Ainda não tem uma conta?</span>
                            <a href="/usuarios/novo" class="text-purple small fw-bold ms-1 text-decoration-none">Comece aqui</a>
                        </div>
                        <div class="text-center">
                            <a href="/" class="text-secondary small text-decoration-none">&larr; Voltar para a tela inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
