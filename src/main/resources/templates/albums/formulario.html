<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao ? 'Editar Álbum - Lynotes' : 'Novo Álbum - Lynotes'}">Álbum - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('albums')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Card Cyberpunk do Formulário -->
                <div class="music-card-cyber p-4 p-md-5">
                    <div class="mb-4">
                        <h2 class="glowing-title-library mb-1" th:text="${edicao ? 'Editar Álbum' : 'Novo Álbum'}">Novo Álbum</h2>
                        <p class="text-secondary mb-0">Cadastre ou edite as informações de um álbum musical.</p>
                    </div>

                    <div class="alert alert-danger rounded-4 mb-4" th:if="${erro}" th:text="${erro}"></div>

                    <form method="post" th:action="${acao}" hx-boost="false">
                        <!-- Título -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="titulo">Título do Álbum</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="titulo"
                                   name="titulo"
                                   th:value="${titulo}"
                                   placeholder="Ex: Random Access Memories, AM..."
                                   required
                                   maxlength="100"
                                   autocomplete="off">
                        </div>

                        <!-- Artista -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="artista">Artista / Banda</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="artista"
                                   name="artista"
                                   th:value="${artista}"
                                   placeholder="Ex: Daft Punk"
                                   required
                                   maxlength="100"
                                   autocomplete="off">
                        </div>

                        <!-- Ano de Lançamento -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="anoLancamento">Ano de Lançamento</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="anoLancamento"
                                   name="anoLancamento"
                                   type="number"
                                   min="1900"
                                   max="2099"
                                   th:value="${anoLancamento}"
                                   placeholder="Ex: 2013"
                                   autocomplete="off">
                        </div>

                        <!-- URL da Capa -->
                        <div class="mb-5">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="capaUrl">URL da Capa do Álbum</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="capaUrl"
                                   name="capaUrl"
                                   type="url"
                                   th:value="${capaUrl}"
                                   placeholder="https://exemplo.com/capa-album.jpg"
                                   autocomplete="off">
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-10">
                            <a class="btn btn-outline-secondary rounded-pill px-4" href="/albums">Cancelar</a>
                            <button class="btn-add-music-glow px-4" type="submit">
                                <i class="bi bi-check-circle-fill me-1"></i>
                                <span th:text="${edicao ? 'Salvar Alterações' : 'Cadastrar Álbum'}">Cadastrar</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="/js/player.js" defer></script>
</body>
</html>
