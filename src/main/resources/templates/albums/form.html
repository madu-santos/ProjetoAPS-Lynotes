<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${album.id == null ? 'Novo Álbum' : 'Editar Álbum'}"></title>
</head>
<body>
    <section>
        <h1 class="mb-4" th:text="${album.id == null ? 'Novo Álbum' : 'Editar Álbum'}"></h1>

        <form th:action="${album.id == null ? '/albums' : '/albums/edit/' + album.id}" th:object="${album}" method="post">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título:</label>
                <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                       th:classappend="${#fields.hasErrors('titulo') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
            </div>
            <div class="mb-3">
                <label for="artista" class="form-label">Artista:</label>
                <input type="text" class="form-control" id="artista" th:field="*{artista}"
                       th:classappend="${#fields.hasErrors('artista') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('artista')}" th:errors="*{artista}"></div>
            </div>
            <div class="mb-3">
                <label for="anoLancamento" class="form-label">Ano de Lançamento:</label>
                <input type="number" class="form-control" id="anoLancamento" th:field="*{anoLancamento}"
                       th:classappend="${#fields.hasErrors('anoLancamento') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('anoLancamento')}" th:errors="*{anoLancamento}"></div>
            </div>
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="/albums" class="btn btn-secondary">Cancelar</a>
        </form>
    </section>
</body>
</html>
