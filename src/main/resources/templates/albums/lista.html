<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbuns - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('albums')}"></div>

    <main class="spotify-main container py-5">
        <!-- Header Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="glowing-title-library mb-1">Álbuns</h1>
                <p class="text-secondary mb-0">Cadastre e explore os álbuns do acervo musical.</p>
            </div>
            <a class="btn-add-music-glow" href="/albums/novo">
                <i class="bi bi-plus-circle-fill fs-5"></i> Novo Álbum
            </a>
        </div>

        <!-- Glassmorphism Search Bar -->
        <form class="glass-search-box p-2 mb-5 d-flex align-items-center gap-2" method="get" action="/albums">
            <i class="bi bi-search text-purple fs-5 ms-3"></i>
            <input class="form-control glass-search-input pe-3"
                   name="busca"
                   placeholder="Buscar álbuns por título, artista..."
                   th:value="${busca}"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="off"
                   spellcheck="false">
            <a th:if="${buscaAtiva}" class="text-secondary small me-2 text-decoration-none" href="/albums">Limpar</a>
            <button class="glass-search-btn" type="submit">Buscar</button>
        </form>

        <!-- Mensagens Vazio -->
        <div class="alert alert-dark border-purple text-purple text-center p-4 rounded-4 mb-5" th:if="${semAlbums and not buscaAtiva}">
            <i class="bi bi-disc fs-2 mb-2 d-block"></i>
            Nenhum álbum cadastrado ainda. Clique em <strong>Novo Álbum</strong> acima para começar!
        </div>
        <div class="alert alert-dark border-secondary text-secondary text-center p-4 rounded-4 mb-5" th:if="${semAlbums and buscaAtiva}">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            Nenhum álbum encontrado para o termo pesquisado.
        </div>

        <!-- Grid de Cards de Álbuns -->
        <div th:unless="${semAlbums}" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="album : ${albums}">
                <div class="music-card-cyber h-100 d-flex flex-column justify-content-between p-3">
                    <div>
                        <!-- Capa do Álbum -->
                        <div class="music-card-cover-container mb-3">
                            <img th:if="${album.capaUrl != null and !album.capaUrl.isBlank()}" th:src="${album.capaUrl}" class="music-card-cover" alt="Capa do Álbum">
                            <div th:unless="${album.capaUrl != null and !album.capaUrl.isBlank()}" class="w-100 h-100 d-flex align-items-center justify-content-center bg-dark text-secondary">
                                <i class="bi bi-disc fs-1"></i>
                            </div>
                        </div>

                        <!-- Informações do Álbum -->
                        <h5 class="fw-bold text-white mb-1 text-truncate" th:text="${album.titulo}"></h5>
                        <p class="text-secondary small mb-2 text-truncate" th:text="${album.artista}"></p>
                    </div>

                    <!-- Metadados de Baixo (Ano & Ações) -->
                    <div>
                        <div class="d-flex align-items-center justify-content-between pt-2 border-top border-secondary border-opacity-10 mt-2 mb-3">
                            <span class="text-secondary small font-monospace" th:text="${album.anoLancamento != null ? 'Ano: ' + album.anoLancamento : 'Álbum'}"></span>
                        </div>
                        <div class="d-flex justify-content-center gap-2">
                            <a class="btn btn-outline-purple btn-sm px-3 rounded-pill" th:href="${'/albums/edit/' + album.id}">
                                <i class="bi bi-pencil-fill me-1"></i> Editar
                            </a>
                            <form method="post" th:action="${'/albums/' + album.id + '/excluir'}" onsubmit="return confirm('Excluir este álbum?');" class="m-0">
                                <button class="btn btn-outline-danger btn-sm px-3 rounded-pill" type="submit">
                                    <i class="bi bi-trash-fill me-1"></i> Excluir
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="/js/player.js" defer></script>
</body>
</html>
