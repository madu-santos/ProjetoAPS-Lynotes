<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${playlist.nome} + ' - Playlist'">Playlist - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="/js/player.js" defer></script>
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

<nav class="navbar navbar-expand bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-purple" href="/">Lynotes</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/artistas">Artistas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/albums">Álbuns</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/musicas">Músicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/playlists">Playlists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/usuarios">Usuários</a>
                </li>
            </ul>
            <form method="post" action="/logout">
                <span class="text-white me-3" th:text="'Olá, ' + ${usuarioLogado}"></span>
                <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold" th:text="${playlist.nome}"></h1>
                        <p class="text-muted mb-0">Adicione links do YouTube e reproduza como áudio.</p>
                    </div>
                    <a class="btn btn-outline-secondary" href="/playlists">Voltar</a>
                </div>

                <div class="card shadow-sm p-4 mb-4">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
                    <form method="post" th:action="${'/playlists/' + playlist.id + '/items'}">
                        <div class="mb-3">
                            <label class="form-label">Link do YouTube</label>
                            <input class="form-control" type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>
                        </div>
                        <button class="btn btn-primary" type="submit">Adicionar à playlist</button>
                    </form>
                </div>

                <div class="card shadow-sm p-4 mb-4">
                    <h2 class="h5 mb-3">Faixas</h2>
                    <div class="list-group">
                        <div class="list-group-item d-flex justify-content-between align-items-start gap-3" th:each="item : ${items}" th:id="${'item-' + item.id}">
                            <div>
                                <div class="fw-semibold" th:text="${item.titulo}"></div>
                                <div class="text-muted small" th:text="${item.url}"></div>
                            </div>
                            <div class="btn-group" role="group" aria-label="Ações de playlist">
                                <button class="btn btn-outline-primary btn-sm" type="button"
                                        th:data-video-id="${item.videoId}"
                                        th:data-titulo="${item.titulo}"
                                        th:data-playlist-id="${playlist.id}"
                                        onclick="playerLoad(this.getAttribute('data-video-id'), this.getAttribute('data-titulo'), this.getAttribute('data-playlist-id'))">Tocar</button>
                                <form method="post" th:action="${'/playlists/' + playlist.id + '/items/' + item.id + '/remover'}" class="d-inline">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Remover</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">

</div>
<div th:insert="fragments/player :: player" class="sticky-top" style="top: 80px;"></div>
            </div>
        </div>
    </main>
</body>
</html>
