<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${playlist.nome} + ' - Lynotes'">Playlist - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('musicas')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <!-- Playlist Header Hero Card -->
                <div class="music-card-cyber p-4 p-md-5 mb-4">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                        <div>
                            <div class="d-flex align-items-center gap-3 mb-2">
                                <h1 class="glowing-title-library mb-0" th:text="${playlist.nome}">Nome da Playlist</h1>
                                <span class="badge bg-purple rounded-pill px-3 py-1" th:if="${playlist.oculta}">Oculta</span>
                            </div>
                            <p class="text-secondary mb-0">Adicione e ouça faixas do YouTube diretamente no mini-player.</p>
                        </div>

                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-purple btn-sm rounded-pill px-3" th:href="${'/playlists/' + playlist.id + '/editar'}" th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                <i class="bi bi-pencil-fill me-1"></i> Editar
                            </a>
                            <form method="post" th:action="${'/playlists/' + playlist.id + '/excluir'}" th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}" onsubmit="return confirm('Excluir esta playlist?');" class="m-0">
                                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" type="submit">
                                    <i class="bi bi-trash-fill me-1"></i> Excluir
                                </button>
                            </form>
                            <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" href="/musicas">Voltar</a>
                        </div>
                    </div>
                </div>

                <!-- Formulário: Adicionar Faixa por Link -->
                <div class="music-card-cyber p-4 mb-4">
                    <h5 class="fw-bold text-white mb-3 d-flex align-items-center gap-2">
                        <i class="bi bi-plus-circle-fill text-purple"></i> Adicionar Faixa por Link do YouTube
                    </h5>
                    <div class="alert alert-danger rounded-4 mb-3" th:if="${erro}" th:text="${erro}"></div>
                    <form method="post" th:action="${'/playlists/' + playlist.id + '/items'}" hx-boost="false" class="row g-2 align-items-center">
                        <div class="col-md-9">
                            <input class="form-control glass-search-input bg-dark border-secondary p-3 text-white" 
                                   type="url" 
                                   name="url" 
                                   placeholder="https://www.youtube.com/watch?v=..." 
                                   required
                                   autocomplete="off">
                        </div>
                        <div class="col-md-3">
                            <button class="btn-add-music-glow w-100 py-3" type="submit">
                                <i class="bi bi-plus-lg me-1"></i> Adicionar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Lista de Faixas / Itens da Playlist -->
                <div class="music-card-cyber p-4">
                    <h5 class="fw-bold text-white mb-4 d-flex align-items-center gap-2">
                        <i class="bi bi-music-note-list text-purple"></i> Faixas da Playlist
                    </h5>

                    <div class="alert alert-dark border-purple text-secondary text-center p-4 rounded-4" th:if="${items == null or items.isEmpty()}">
                        Nenhuma faixa adicionada nesta playlist ainda. Insira uma URL acima!
                    </div>

                    <div class="d-flex flex-column gap-3" th:unless="${items == null or items.isEmpty()}">
                        <div class="d-flex align-items-center justify-content-between p-3 rounded-3 bg-darker border border-secondary border-opacity-10" 
                             th:each="item, iter : ${items}" 
                             th:id="${'item-' + item.id}">
                            
                            <div class="d-flex align-items-center gap-3 overflow-hidden">
                                <span class="fw-bold text-purple font-monospace ms-2 fs-5" th:text="${iter.count}">1</span>
                                <div class="overflow-hidden">
                                    <h6 class="fw-bold text-white mb-0 text-truncate" th:text="${item.titulo}"></h6>
                                    <span class="text-secondary small font-monospace text-truncate d-block" th:text="${item.url}"></span>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <button type="button" 
                                        class="btn btn-outline-purple btn-sm rounded-pill px-3"
                                        th:data-url="${item.url}"
                                        th:data-titulo="${item.titulo}"
                                        th:data-ytid="${item.videoId}"
                                        onclick="if(typeof playerTocar === 'function') playerTocar(this.getAttribute('data-url'), this.getAttribute('data-titulo'), 'Playlist', '', this.getAttribute('data-ytid'));">
                                    <i class="bi bi-play-fill me-1"></i> Tocar
                                </button>
                                
                                <form method="post" th:action="${'/playlists/' + playlist.id + '/items/' + item.id + '/remover'}" hx-boost="false" class="m-0">
                                    <button class="btn btn-outline-danger btn-sm rounded-pill px-3" type="submit">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="/js/player.js" defer></script>
</body>
</html>
