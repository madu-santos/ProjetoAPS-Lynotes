<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-purple" href="/">Lynotes</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/artistas">Artistas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/albums">Álbuns</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/musicas">Músicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/playlists">Playlists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/usuarios">Usuários</a>
                </li>
            </ul>
            <form method="post" action="/logout">
                <span class="text-white me-3" th:text="'Olá, ' + ${usuarioLogado}"></span>
                <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold">Playlists</h1>
                <p class="text-muted mb-0">Gerencie suas playlists de links do YouTube.</p>
            </div>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h2 class="h5 mb-3">Nova playlist</h2>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
            <form method="post" action="/playlists">
                <div class="input-group">
                    <input class="form-control" type="text" name="nome" placeholder="Nome da playlist" required>
                    <button class="btn btn-primary" type="submit">Criar</button>
                </div>
            </form>
        </div>

        <div class="row g-3">
            <div class="col-12" th:if="${#lists.isEmpty(playlists)}">
                <div class="alert alert-secondary">Nenhuma playlist cadastrada ainda.</div>
            </div>
            <div class="col-12 col-md-6" th:each="playlist : ${playlists}">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${playlist.nome}"></h5>
                        <p class="text-muted mb-2">Criada em <span th:text="${#dates.format(playlist.criadoEm, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <a class="btn btn-outline-primary btn-sm" th:href="${'/playlists/' + playlist.id}">Abrir playlist</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:insert="fragments/player :: player"></div>
    <script src="/js/player.js" defer></script>
</body>
</html>
