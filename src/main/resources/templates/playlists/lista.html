<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('musicas')}"></div>

    <main class="spotify-main container py-5">
        <!-- Header Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="glowing-title-library mb-1">Playlists</h1>
                <p class="text-secondary mb-0">Crie e gerencie suas coleções de faixas.</p>
            </div>
            <a class="btn-add-music-glow" href="/playlists/new">
                <i class="bi bi-plus-circle-fill fs-5"></i> Nova Playlist
            </a>
        </div>

        <!-- Glassmorphism Search Bar -->
        <form class="glass-search-box p-2 mb-5 d-flex align-items-center gap-2" method="get" action="/playlists">
            <i class="bi bi-search text-purple fs-5 ms-3"></i>
            <input class="form-control glass-search-input pe-3"
                   name="busca"
                   placeholder="Buscar playlists por nome..."
                   th:value="${busca}"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="off"
                   spellcheck="false">
            <a th:if="${buscaAtiva}" class="text-secondary small me-2 text-decoration-none" href="/playlists">Limpar</a>
            <button class="glass-search-btn" type="submit">Buscar</button>
        </form>

        <!-- Mensagens Vazio -->
        <div class="alert alert-dark border-purple text-purple text-center p-4 rounded-4 mb-5" th:if="${#lists.isEmpty(playlists) and not buscaAtiva}">
            <i class="bi bi-collection-play fs-2 mb-2 d-block"></i>
            Nenhuma playlist cadastrada ainda. Clique em <strong>Nova Playlist</strong> acima para começar!
        </div>
        <div class="alert alert-dark border-secondary text-secondary text-center p-4 rounded-4 mb-5" th:if="${#lists.isEmpty(playlists) and buscaAtiva}">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            Nenhuma playlist encontrada para o termo pesquisado.
        </div>

        <!-- Grid de Cards de Playlists -->
        <div th:unless="${#lists.isEmpty(playlists)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="playlist : ${playlists}">
                <div class="music-card-cyber p-4 h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <!-- Playlist Cover -->
                            <div class="shadow d-flex align-items-center justify-content-center" 
                                 style="width: 54px; height: 54px; min-width: 54px; background-color: #B57CFF; color: #000000; border-radius: 12px !important;">
                                <i class="bi bi-collection-play fs-3"></i>
                            </div>
                            <div class="overflow-hidden">
                                <h5 class="fw-bold text-white mb-0 text-truncate" th:text="${playlist.nome}"></h5>
                                <span class="badge bg-purple rounded-pill px-2 py-0.5 mt-1" th:if="${playlist.oculta}">Oculta</span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between pt-3 border-top border-secondary border-opacity-10 mt-3">
                        <span class="text-secondary small font-monospace" th:text="${'Criada em ' + playlist.criadoEmFormatado}"></span>
                        
                        <div class="d-flex align-items-center gap-2">
                            <!-- Dropdown 3 dots horizontal -->
                            <div class="dropend">
                                <button class="btn btn-link text-secondary p-0 shadow-none me-2" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Opções">
                                    <i class="bi bi-three-dots fs-5"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-dark bg-darker border-secondary shadow">
                                    <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <a class="dropdown-item text-white" th:href="${'/playlists/' + playlist.id + '/editar'}">
                                            <i class="bi bi-pencil me-2 text-purple"></i>Editar
                                        </a>
                                    </li>
                                    <li th:unless="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <span class="dropdown-item text-secondary disabled" title="Playlist padrão não pode ser editada.">
                                            <i class="bi bi-pencil me-2"></i>Editar (Fixa)
                                        </span>
                                    </li>
                                    <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <form method="post" 
                                              th:action="${'/playlists/' + playlist.id + '/excluir'}" 
                                              th:data-nome="${playlist.nome}"
                                              onsubmit="return confirmarExclusaoCustom(this, 'Excluir Playlist?', 'Tem certeza que deseja excluir a playlist &quot;' + this.getAttribute('data-nome') + '&quot;?');"
                                              hx-boost="false" 
                                              class="m-0">
                                            <button type="submit" class="dropdown-item text-danger">
                                                <i class="bi bi-trash me-2"></i>Excluir
                                            </button>
                                        </form>
                                    </li>
                                    <li th:unless="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <span class="dropdown-item text-secondary disabled" title="Playlist padrão não pode ser excluída.">
                                            <i class="bi bi-trash me-2"></i>Excluir (Fixa)
                                        </span>
                                    </li>
                                </ul>
                            </div>

                            <button type="button" 
                                    class="btn btn-purple btn-sm rounded-circle p-0 d-flex align-items-center justify-content-center shadow-sm me-1" 
                                    style="width: 32px; height: 32px; min-width: 32px;"
                                    title="Carregar Playlist no Miniplayer"
                                    th:data-plid="${playlist.id}"
                                    onclick="if(typeof playerFetchPlaylist === 'function') playerFetchPlaylist(this.getAttribute('data-plid'), true);">
                                <i class="bi bi-play-fill text-white fs-5"></i>
                            </button>

                            <a class="btn btn-outline-purple btn-sm rounded-pill px-3" th:href="${'/playlists/' + playlist.id}">
                                Abrir <i class="bi bi-arrow-right me-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="/js/player.js?v=3" defer></script>
</body>
</html>
