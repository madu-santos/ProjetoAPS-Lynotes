<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('playlists')}"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold">Playlists</h1>
                <p class="text-muted mb-0">Gerencie suas playlists de links do YouTube.</p>
            </div>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h2 class="h5 mb-3">Nova playlist</h2>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
            <form method="post" action="/playlists">
                <div class="input-group">
                    <input class="form-control" type="text" name="nome" placeholder="Nome da playlist" required>
                    <button class="btn btn-primary" type="submit">Criar</button>
                </div>
            </form>
        </div>

        <form class="premium-search-form" method="get" action="/playlists">
            <input class="premium-search-input"
                   name="busca"
                   placeholder="Buscar playlists por nome..."
                   th:value="${busca}">
            <a th:if="${buscaAtiva}" class="premium-search-clear" href="/playlists">Limpar</a>
            <button class="premium-search-btn" type="submit">Buscar</button>
        </form>

        <div class="row g-3">
            <div class="col-12" th:if="${#lists.isEmpty(playlists) and not buscaAtiva}">
                <div class="alert alert-secondary">Nenhuma playlist cadastrada ainda.</div>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(playlists) and buscaAtiva}">
                <div class="alert alert-info">Nenhuma playlist encontrada para o termo pesquisado.</div>
            </div>
            <div class="col-12 col-md-6" th:each="playlist : ${playlists}">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${playlist.nome}"></h5>
                        <p class="text-muted mb-2">Criada em <span th:text="${playlist.criadoEmFormatado}"></span></p>
                        <a class="btn btn-outline-primary btn-sm" th:href="${'/playlists/' + playlist.id}">Abrir playlist</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

</div>
<div th:insert="fragments/player :: player"></div>
    <script src="/js/player.js" defer></script>
</body>
</html>
