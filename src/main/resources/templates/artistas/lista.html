<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistas - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('artistas')}"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1>Artistas</h1>
                <p class="text-secondary mb-0">Cadastre e gerencie os artistas do catálogo.</p>
            </div>
            <a class="btn btn-primary" href="/artistas/novo">Novo artista</a>
        </div>

        <form class="card card-body shadow-sm mb-4" method="get" action="/artistas">
            <div class="row g-2">
                <div class="col">
                    <label class="visually-hidden" for="busca">Buscar artistas</label>
                    <input class="form-control"
                           id="busca"
                           name="busca"
                           placeholder="Buscar por nome, gênero ou biografia"
                           th:value="${busca}">
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
                <div class="col-auto" th:if="${buscaAtiva}">
                    <a class="btn btn-outline-secondary" href="/artistas">Limpar</a>
                </div>
            </div>
        </form>

        <div class="alert alert-secondary" th:if="${semArtistas and not buscaAtiva}">
            Nenhum artista cadastrado.
        </div>

        <div class="alert alert-warning" th:if="${semArtistas and buscaAtiva}">
            Nenhum artista encontrado para
            <strong th:text="${busca}"></strong>.
        </div>

        <div class="card shadow-sm" th:unless="${semArtistas}">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Gênero musical</th>
                            <th>Biografia</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="artista : ${listaArtistas}">
                            <td class="fw-semibold">
                                <span th:text="${artista.nome}"></span>
                                <span class="badge bg-success" th:if="${artista.statusVerificacao.name() == 'APROVADO'}">Verificado</span>
                                <span class="badge bg-warning text-dark" th:if="${artista.statusVerificacao.name() == 'PENDENTE'}">Pendente</span>
                                <span class="badge bg-danger" th:if="${artista.statusVerificacao.name() == 'REJEITADO'}">Rejeitado</span>
                            </td>
                            <td th:text="${artista.generoMusical != null
                                ? artista.generoMusical
                                : 'Não informado'}"></td>
                            <td>
                                <span th:if="${artista.biografia != null}"
                                      th:text="${artista.biografia}"></span>
                                <span class="text-secondary"
                                      th:if="${artista.biografia == null}">
                                    Não informada
                                </span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-outline-primary btn-sm"
                                   th:href="${'/artistas/' + artista.id + '/editar'}">
                                    Editar
                                </a>
                                <form class="d-inline"
                                      method="post"
                                      th:action="${'/artistas/' + artista.id + '/excluir'}">
                                    <button class="btn btn-outline-danger btn-sm"
                                            type="submit"
                                            onclick="return confirm('Excluir este artista?')">
                                        Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</div>
<div th:insert="fragments/player :: player"></div>
    <script src="/js/player.js" defer></script>
</body>
</html>
