<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.edicao ? 'Editar artista - Lynotes' : 'Novo artista - Lynotes'}">
        Artista - Lynotes
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/artistas">Lynotes</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a class="text-decoration-none" href="/artistas">&larr; Voltar para artistas</a>
                    <h1 class="mt-2" th:text="${form.edicao ? 'Editar artista' : 'Novo artista'}"></h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" th:action="${form.acao}">
                            <div class="mb-3">
                                <label class="form-label" for="nome">Nome</label>
                                <input class="form-control"
                                       id="nome"
                                       name="nome"
                                       maxlength="150"
                                       th:value="${form.nome}"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="generoMusical">Gênero musical</label>
                                <input class="form-control"
                                       id="generoMusical"
                                       name="generoMusical"
                                       maxlength="100"
                                       th:value="${form.generoMusical}">
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="biografia">Biografia</label>
                                <textarea class="form-control"
                                          id="biografia"
                                          name="biografia"
                                          rows="6"
                                          th:text="${form.biografia}"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit"
                                        th:text="${form.edicao ? 'Salvar alterações' : 'Cadastrar artista'}">
                                </button>
                                <a class="btn btn-outline-secondary" href="/artistas">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
