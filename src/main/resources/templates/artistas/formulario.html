<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao ? 'Editar Artista - Lynotes' : 'Novo Artista - Lynotes'}">Artista - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('artistas')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Card Cyberpunk do Formulário -->
                <div class="music-card-cyber p-4 p-md-5">
                    <div class="mb-4">
                        <h2 class="glowing-title-library mb-1" th:text="${edicao ? 'Editar Artista' : 'Novo Artista'}">Novo Artista</h2>
                        <p class="text-secondary mb-0">Cadastre ou atualize as informações do artista no seu acervo.</p>
                    </div>

                    <div class="alert alert-danger rounded-4 mb-4" th:if="${erro}" th:text="${erro}"></div>

                    <form method="post" th:action="${acao}" hx-boost="false">
                        <!-- Nome -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="nome">Nome do Artista</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="nome"
                                   name="nome"
                                   th:value="${nome}"
                                   placeholder="Ex: Daft Punk, Arctic Monkeys..."
                                   required
                                   maxlength="100"
                                   autocomplete="off">
                        </div>

                        <!-- Gênero Musical -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="generoMusical">Gênero Musical</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="generoMusical"
                                   name="generoMusical"
                                   th:value="${generoMusical}"
                                   placeholder="Ex: Synthwave, Indie Rock, MPB..."
                                   maxlength="50"
                                   autocomplete="off">
                        </div>

                        <!-- URL da Foto de Capa -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="capaUrl">URL da Foto / Imagem</label>
                            <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                   id="capaUrl"
                                   name="capaUrl"
                                   type="url"
                                   th:value="${capaUrl}"
                                   placeholder="https://exemplo.com/foto-artista.jpg"
                                   autocomplete="off">
                        </div>

                        <!-- Biografia -->
                        <div class="mb-5">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="biografia">Biografia / Descrição</label>
                            <textarea class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                      id="biografia"
                                      name="biografia"
                                      rows="4"
                                      th:text="${biografia}"
                                      placeholder="Escreva um resumo da carreira e conquistas deste artista..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-10">
                            <a class="btn btn-outline-secondary rounded-pill px-4" href="/artistas">Cancelar</a>
                            <button class="btn-add-music-glow px-4" type="submit">
                                <i class="bi bi-check-circle-fill me-1"></i>
                                <span th:text="${edicao ? 'Salvar Alterações' : 'Cadastrar Artista'}">Cadastrar</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="/js/player.js" defer></script>
</body>
</html>
