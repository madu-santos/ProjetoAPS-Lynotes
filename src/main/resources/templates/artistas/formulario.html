<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.edicao ? 'Editar artista - Lynotes' : 'Novo artista - Lynotes'}">
        Artista - Lynotes
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('artistas')}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a class="text-decoration-none" href="/artistas">&larr; Voltar para artistas</a>
                    <h1 class="mt-2" th:text="${form.edicao ? 'Editar artista' : 'Novo artista'}"></h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" th:action="${form.acao}">
                            <div class="mb-3">
                                <label class="form-label" for="nome">Nome</label>
                                <input class="form-control"
                                       id="nome"
                                       name="nome"
                                       maxlength="150"
                                       th:value="${form.nome}"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="generoMusical">Gênero musical</label>
                                <input class="form-control"
                                       id="generoMusical"
                                       name="generoMusical"
                                       maxlength="100"
                                       th:value="${form.generoMusical}">
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="biografia">Biografia</label>
                                <textarea class="form-control"
                                          id="biografia"
                                          name="biografia"
                                          rows="6"
                                          th:text="${form.biografia}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block text-white">Nota (Avaliação)</label>
                                <div class="rating-input">
                                    <input type="radio" id="star5" name="nota" value="5" th:checked="${form.nota == 5}" />
                                    <label for="star5" title="5 estrelas">★</label>
                                    <input type="radio" id="star4" name="nota" value="4" th:checked="${form.nota == 4}" />
                                    <label for="star4" title="4 estrelas">★</label>
                                    <input type="radio" id="star3" name="nota" value="3" th:checked="${form.nota == 3}" />
                                    <label for="star3" title="3 estrelas">★</label>
                                    <input type="radio" id="star2" name="nota" value="2" th:checked="${form.nota == 2}" />
                                    <label for="star2" title="2 estrelas">★</label>
                                    <input type="radio" id="star1" name="nota" value="1" th:checked="${form.nota == 1}" />
                                    <label for="star1" title="1 estrela">★</label>
                                </div>
                            </div>

                            <hr class="my-4">
                            
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       role="switch" 
                                       id="solicitarVerificacao" 
                                       name="solicitarVerificacao" 
                                       th:checked="${form.solicitarVerificacao}">
                                <label class="form-check-label fw-bold" for="solicitarVerificacao">Solicitar selo de artista verificado</label>
                            </div>

                            <div id="dadosVerificacao" style="display: none;">
                                <h5 class="mb-3 text-primary">Dados de Verificação (Exigidos para selo)</h5>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label" for="cpf">CPF (Apenas números)</label>
                                        <input class="form-control"
                                               id="cpf"
                                               name="cpf"
                                               maxlength="14"
                                               placeholder="00011122233"
                                               th:value="${form.cpf}">
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label" for="dataNascimento">Data de Nascimento / Fundação</label>
                                        <input class="form-control"
                                               type="date"
                                               id="dataNascimento"
                                               name="dataNascimento"
                                               th:value="${form.dataNascimento}">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label" for="cep">CEP</label>
                                        <input class="form-control" id="cep" name="cep" maxlength="10" th:value="${form.cep}" placeholder="00000-000">
                                    </div>
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label" for="logradouro">Logradouro</label>
                                        <input class="form-control" id="logradouro" name="logradouro" maxlength="200" th:value="${form.logradouro}" placeholder="Rua, Avenida...">
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label" for="numero">Número</label>
                                        <input class="form-control" id="numero" name="numero" maxlength="20" th:value="${form.numero}">
                                    </div>
                                    <div class="col-md-9 mb-3">
                                        <label class="form-label" for="bairro">Bairro</label>
                                        <input class="form-control" id="bairro" name="bairro" maxlength="100" th:value="${form.bairro}">
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-9 mb-3">
                                        <label class="form-label" for="cidade">Cidade</label>
                                        <input class="form-control" id="cidade" name="cidade" maxlength="100" th:value="${form.cidade}">
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label" for="uf">UF</label>
                                        <input class="form-control" id="uf" name="uf" maxlength="2" th:value="${form.uf}" placeholder="SP">
                                    </div>
                                </div>
                            </div>

                            <script>
                                (function() {
                                    const checkbox = document.getElementById('solicitarVerificacao');
                                    const container = document.getElementById('dadosVerificacao');
                                    
                                    if (!checkbox || !container) return;
                                    
                                    const inputs = container.querySelectorAll('input, textarea');
                                    
                                    function toggleCampos() {
                                        if (checkbox.checked) {
                                            container.style.display = 'block';
                                            inputs.forEach(el => el.setAttribute('required', 'required'));
                                        } else {
                                            container.style.display = 'none';
                                            inputs.forEach(el => el.removeAttribute('required'));
                                        }
                                    }
                                    
                                    function apenasNumeros(e) {
                                        if (/\D/.test(e.target.value)) {
                                            e.target.value = e.target.value.replace(/\D/g, '');
                                            e.target.setCustomValidity("Somente números são aceitos.");
                                            e.target.reportValidity();
                                            setTimeout(() => {
                                                e.target.setCustomValidity("");
                                                e.target.reportValidity();
                                            }, 2000);
                                        } else {
                                            e.target.setCustomValidity("");
                                        }
                                    }
                                    
                                    const cpfInput = document.getElementById('cpf');
                                    const cepInput = document.getElementById('cep');
                                    if (cpfInput) cpfInput.addEventListener('input', apenasNumeros);
                                    if (cepInput) cepInput.addEventListener('input', apenasNumeros);
                                    
                                    checkbox.addEventListener('change', toggleCampos);
                                    
                                    // Chamar no carregamento da página para inicializar corretamente o estado de edição
                                    toggleCampos();
                                })();
                            </script>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit"
                                        th:text="${form.edicao ? 'Salvar alterações' : 'Cadastrar artista'}">
                                </button>
                                <a class="btn btn-outline-secondary" href="/artistas">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</div>
<div th:insert="fragments/player :: player"></div>
    <script src="/js/player.js" defer></script>
</body>
</html>
