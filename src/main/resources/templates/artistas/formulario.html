<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao ? 'Editar Artista - Lynotes' : 'Novo Artista - Lynotes'}">Artista - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('artistas')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Card Cyberpunk do Formulário -->
                <div class="music-card-cyber p-4 p-md-5">
                    <div class="mb-4">
                        <h2 class="glowing-title-library mb-1" th:text="${form.edicao ? 'Editar Artista' : 'Novo Artista'}">Novo Artista</h2>
                        <p class="text-secondary mb-0" th:text="${form.edicao ? 'Atualize as informações do artista no seu acervo.' : 'Adicionar novo artista ao acervo'}">Adicionar novo artista ao acervo</p>
                    </div>

                    <div class="alert alert-danger rounded-4 mb-4" th:if="${erro}" th:text="${erro}"></div>

                    <form method="post" th:action="${form.acao}">
                        
                        <!-- Pesquisa no YouTube (Criar) -->
                        <div th:if="${!form.edicao}" class="mb-4 p-4 rounded-4 border border-purple bg-darker shadow">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold mb-2" for="ytQuery">
                                <i class="bi bi-youtube text-danger me-1"></i> Preencher dados com o YouTube
                            </label>
                            <div class="position-relative">
                                <input type="text" id="ytQuery" class="form-control glass-search-input bg-dark text-white border-secondary pe-5" placeholder="Digite o nome do Artista/Canal..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="window.debounceSearchYT('ARTISTA')" onkeydown="window.handleKeyNav(event, 'ARTISTA')">
                                <button type="button" class="btn text-purple position-absolute top-50 end-0 translate-middle-y me-2 p-1 border-0" onclick="window.buscarYT('ARTISTA')" title="Buscar no YouTube">
                                    <i class="bi bi-search fs-5 text-purple"></i>
                                </button>
                            </div>

                            <!-- Spinner -->
                            <div id="ytSpinner" class="text-center py-3 d-none">
                                <div class="spinner-border spinner-border-sm text-purple" role="status"></div>
                                <span class="text-secondary small ms-2">Buscando canais no YouTube...</span>
                            </div>

                            <!-- Resultados -->
                            <div id="ytResults" class="d-flex flex-column gap-2 mt-3 overflow-auto" style="max-height: 250px;"></div>
                        </div>

                        <!-- Preview do Artista Selecionado -->
                        <div id="artistPreview" class="d-none mb-4 p-3 rounded-4 bg-darker border border-purple align-items-center gap-3 shadow text-center position-relative">
                            <img id="previewCapa" src="" class="rounded-circle shadow-lg mb-3" style="width: 120px; height: 120px; object-fit: cover; border: 3px solid #b268ff;">
                            <h4 id="previewNome" class="fw-bold text-white mb-1"></h4>
                            <p id="previewBio" class="text-secondary small mb-0 px-3 overflow-hidden" style="max-height: 60px; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;"></p>
                        </div>

                        <!-- OPINIÃO E AVALIAÇÃO (Sempre visível) -->
                        <div class="mb-4 p-4 rounded-4 bg-darker border border-secondary border-opacity-20">
                            <h5 class="fw-bold text-purple mb-3"><i class="bi bi-chat-left-quote me-2"></i> Sua Avaliação</h5>
                            
                            <div class="mb-0">
                                <label class="form-label d-block text-white fw-bold">Sua nota (1 a 5 estrelas)</label>
                                <div class="interactive-stars fs-2" data-input="nota-input" th:attr="data-initial=${form.nota}" style="cursor: pointer;">
                                    <i class="bi bi-star star-btn text-warning" data-index="1"></i>
                                    <i class="bi bi-star star-btn text-warning" data-index="2"></i>
                                    <i class="bi bi-star star-btn text-warning" data-index="3"></i>
                                    <i class="bi bi-star star-btn text-warning" data-index="4"></i>
                                    <i class="bi bi-star star-btn text-warning" data-index="5"></i>
                                </div>
                                <input type="hidden" name="nota" id="nota-input" th:value="${form.nota}">
                            </div>
                        </div>

                        <!-- Toggle para exibir formulário bruto -->
                        <div class="form-check form-switch mb-4" th:if="${!form.edicao}">
                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="toggleRawForm" onchange="document.getElementById('rawFormFields').classList.toggle('d-none')">
                            <label class="form-check-label text-secondary small" for="toggleRawForm">
                                Editar informações manualmente
                            </label>
                        </div>

                        <!-- CAMPOS BRUTOS -->
                        <div id="rawFormFields" th:classappend="${form.edicao} ? '' : 'd-none'">
                            <!-- Nome -->
                            <div class="mb-4">
                                <label class="form-label text-purple font-monospace small uppercase fw-bold" for="nome">Nome do Artista</label>
                                <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                       id="nome"
                                       name="nome"
                                       th:value="${form.nome}"
                                       placeholder="Ex: Daft Punk, Arctic Monkeys..."
                                       maxlength="100"
                                       autocomplete="off">
                            </div>


                            <!-- URL da Foto de Capa -->
                            <div class="mb-4">
                                <label class="form-label text-purple font-monospace small uppercase fw-bold" for="capaUrl">URL da Foto / Imagem</label>
                                <input class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                       id="capaUrl"
                                       name="capaUrl"
                                       type="text"
                                       th:value="${form.capaUrl}"
                                       placeholder="https://exemplo.com/foto-artista.jpg"
                                       autocomplete="off">
                            </div>

                            <!-- Biografia -->
                            <div class="mb-5">
                                <label class="form-label text-purple font-monospace small uppercase fw-bold" for="biografia">Biografia / Descrição</label>
                                <textarea class="form-control glass-search-input bg-dark text-white border-secondary p-3"
                                          id="biografia"
                                          name="biografia"
                                          rows="4"
                                          th:text="${form.biografia}"
                                          placeholder="Escreva um resumo da carreira e conquistas deste artista..."></textarea>
                            </div>
                            
                            <!-- CAMPOS OCULTOS -->
                            <input type="hidden" id="youtubeId" name="youtubeId">
                        </div>

                        <!-- Compartilhar na Comunidade Checkbox -->
                        <div class="form-check form-switch mb-4" th:if="${!form.edicao}">
                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="compartilharNaComunidade" name="compartilharNaComunidade" checked>
                            <label class="form-check-label text-secondary small" for="compartilharNaComunidade">
                                Compartilhar na comunidade (criar postagem automática)
                            </label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-10">
                            <a class="btn btn-outline-secondary rounded-pill px-4" href="/artistas">Cancelar</a>
                            <button class="btn-add-music-glow px-4" type="submit">
                                <i class="bi bi-check-circle-fill me-1"></i>
                                <span th:text="${form.edicao ? 'Salvar Alterações' : 'Cadastrar Artista'}">Cadastrar</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>
    <script>
        (function() {
            let searchTimer = null;
            let itemsList = [];
            let activeIndex = -1;

            window.debounceSearchYT = function(tipo) {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => window.buscarYT(tipo), 250);
            };

            window.handleKeyNav = function(e, tipo) {
                const resultsDiv = document.getElementById('ytResults');
                if (!resultsDiv || itemsList.length === 0) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        window.buscarYT(tipo);
                    }
                    return;
                }

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeIndex = (activeIndex + 1) % itemsList.length;
                    updateHighlight();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeIndex = (activeIndex - 1 + itemsList.length) % itemsList.length;
                    updateHighlight();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (activeIndex >= 0 && activeIndex < itemsList.length) {
                        window.selecionarItem(activeIndex);
                    } else {
                        window.buscarYT(tipo);
                    }
                }
            };

            function updateHighlight() {
                const resultsDiv = document.getElementById('ytResults');
                if (!resultsDiv) return;
                const children = resultsDiv.querySelectorAll('.yt-result-item');
                children.forEach((child, idx) => {
                    if (idx === activeIndex) {
                        child.classList.add('active-item');
                        child.scrollIntoView({ block: 'nearest' });
                    } else {
                        child.classList.remove('active-item');
                    }
                });
            }

            window.buscarYT = function(tipo) {
                const queryInput = document.getElementById('ytQuery');
                if (!queryInput) return;
                const query = queryInput.value.trim();
                const resultsDiv = document.getElementById('ytResults');
                const spinner = document.getElementById('ytSpinner');

                if (!query) {
                    if (resultsDiv) resultsDiv.innerHTML = '';
                    activeIndex = -1;
                    return;
                }

                if (spinner) spinner.classList.remove('d-none');
                if (resultsDiv) resultsDiv.innerHTML = '';
                activeIndex = -1;

                fetch('/api/youtube/search?q=' + encodeURIComponent(query) + '&tipo=' + tipo)
                    .then(r => r.json())
                    .then(data => {
                        if (spinner) spinner.classList.add('d-none');
                        itemsList = data || [];
                        activeIndex = -1;
                        if (!resultsDiv) return;
                        if (itemsList.length === 0) {
                            resultsDiv.innerHTML = '<div class="text-secondary small p-2">Nenhum canal encontrado.</div>';
                            return;
                        }
                        resultsDiv.innerHTML = itemsList.map((item, idx) => `
                            <div class="d-flex align-items-center justify-content-between p-2 rounded bg-dark border border-secondary cursor-pointer yt-result-item" data-index="${idx}" onclick="window.selecionarItem(${idx})">
                                <div class="d-flex align-items-center gap-2">
                                    <img src="${item.capaUrl || '/public/img/default-cover.png'}" class="rounded-circle" style="width: 48px; height: 48px; object-fit: cover;">
                                    <div>
                                        <div class="fw-bold text-white small">${escapeHtml(item.titulo)}</div>
                                        <div class="text-secondary extra-small">Canal Oficial</div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-purple">Preencher</button>
                            </div>
                        `).join('');
                    })
                    .catch(() => {
                        if (spinner) spinner.classList.add('d-none');
                        if (resultsDiv) resultsDiv.innerHTML = '<div class="text-danger small p-2">Erro ao realizar a busca.</div>';
                    });
            };

            function escapeHtml(text) {
                return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }

            window.selecionarItem = function(idx) {
                const item = itemsList[idx];
                if (!item) return;

                document.getElementById('nome').value = item.titulo;
                document.getElementById('capaUrl').value = item.capaUrl || '';
                document.getElementById('biografia').value = item.descricao || '';
                
                const ytId = document.getElementById('youtubeId');
                if (ytId) ytId.value = item.youtubeId || '';
                
                // Preencher Preview
                document.getElementById('previewCapa').src = item.capaUrl || '/public/img/default-cover.png';
                document.getElementById('previewNome').innerText = item.titulo;
                document.getElementById('previewBio').innerText = item.descricao || '';
                
                // Mostrar Preview e limpar busca
                const preview = document.getElementById('artistPreview');
                if (preview) {
                    preview.classList.remove('d-none');
                    preview.classList.add('d-flex');
                    preview.classList.add('flex-column');
                }
                
                document.getElementById('ytResults').innerHTML = '';
                document.getElementById('ytQuery').value = item.titulo;
                activeIndex = -1;
            };
        })();
    </script>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
</body>
</html>
