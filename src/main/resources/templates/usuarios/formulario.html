<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao ? 'Editar usuário - Lynotes' : 'Criar Conta - Lynotes'}">
        Usuário - Lynotes
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" th:classappend="${usuarioLogado == null} ? 'd-flex flex-column align-items-center justify-content-center' : ''" th:style="${usuarioLogado == null} ? 'min-height: 100vh;' : ''">
<div id="app-content" class="w-100">

    
    <!-- Navbar (Apenas se logado) -->
    <div th:insert="~{fragments/navbar :: navbar('comunidade')}" th:if="${usuarioLogado != null}"></div>

    <!-- Main Container para usuários NÃO logados (Centralizado) -->
    <div class="container w-100" th:if="${usuarioLogado == null}">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold text-purple mb-1">Criar Conta</h1>
                            <p class="text-muted small">Crie seu perfil no Lynotes para catalogar músicas</p>
                        </div>

                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" action="/usuarios" hx-boost="false">
                            <div class="mb-3">
                                <label class="form-label" for="nome">Nome</label>
                                <input class="form-control" id="nome" name="nome" th:value="${nome}" required autofocus placeholder="Seu nome">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control" id="username" name="username" th:value="${username}" required placeholder="ex: m4iz44">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">E-mail</label>
                                <input class="form-control" id="email" name="email" type="email" th:value="${email}" required placeholder="nome@email.com">
                            </div>

                            <!-- Apenas exibe 'Sobre mim' se for edição de conta na visão do painel (não na tela de Criar Conta principal).
                                 Como este é o formulário de cadastro principal, removemos a bio. -->

                            <div class="mb-4">
                                <label class="form-label" for="senha">Senha</label>
                                <input class="form-control" id="senha" name="senha" type="password" required placeholder="Mínimo de 6 caracteres">
                            </div>

                            <button class="btn btn-primary w-100 btn-lg mb-3" type="submit">Cadastrar</button>
                        </form>
                        <div class="text-center mt-2 mb-3">
                            <span class="text-secondary small">Já possui uma conta?</span>
                            <a href="/login" hx-boost="false" class="text-purple small fw-bold ms-1">Entrar na conta</a>
                        </div>
                        <div class="text-center">
                            <a href="/" hx-boost="false" class="text-purple small">← Voltar para a tela inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container para usuários logados (Administração) -->
    <main class="container py-5 mt-5" th:if="${usuarioLogado != null}">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a class="text-decoration-none" href="/usuarios">&larr; Voltar para usuários</a>
                    <h1 class="mt-2 fw-bold" th:text="${edicao ? 'Editar usuário' : 'Novo usuário'}"></h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" th:action="${acao}" hx-boost="false">
                            <div class="mb-3">
                                <label class="form-label" for="nome_admin">Nome</label>
                                <input class="form-control"
                                       id="nome_admin"
                                       name="nome"
                                       maxlength="100"
                                       th:value="${nome}"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="username_admin">Username</label>
                                <input class="form-control"
                                       id="username_admin"
                                       name="username"
                                       maxlength="100"
                                       th:value="${username}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email_admin">E-mail</label>
                                <input class="form-control"
                                       id="email_admin"
                                       name="email"
                                       type="email"
                                       maxlength="100"
                                       th:value="${email}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="bio_admin">Sobre mim</label>
                                <textarea class="form-control" id="bio_admin" name="bio" rows="3" maxlength="500" placeholder="Conte um pouco sobre você..." th:text="${bio}"></textarea>
                                <div class="form-text">Máximo de 500 caracteres.</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="senha_admin">Senha</label>
                                <input class="form-control"
                                       id="senha_admin"
                                       name="senha"
                                       type="password"
                                       th:required="${not edicao}">
                                <div class="form-text text-muted" th:if="${edicao}">
                                    Deixe em branco para manter a mesma senha.
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit"
                                        th:text="${edicao ? 'Salvar alterações' : 'Cadastrar usuário'}">
                                </button>
                                <a class="btn btn-outline-secondary" href="/usuarios">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
</div>
<div th:insert="fragments/player :: player" th:if="${usuarioLogado != null}"></div>
    <script src="/js/player.js" defer th:if="${usuarioLogado != null}"></script>
</body>
</html>
