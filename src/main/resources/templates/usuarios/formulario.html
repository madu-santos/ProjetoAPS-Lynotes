<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao ? 'Editar usuário - Lynotes' : 'Novo usuário - Lynotes'}">
        Usuário - Lynotes
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/artistas">Lynotes</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/artistas">Artistas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/usuarios">Usuários</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a class="text-decoration-none" href="/usuarios">&larr; Voltar para usuários</a>
                    <h1 class="mt-2 text-purple" th:text="${edicao ? 'Editar usuário' : 'Novo usuário'}"></h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" th:action="${acao}">
                            <div class="mb-3">
                                <label class="form-label" for="nome">Nome completo</label>
                                <input class="form-control"
                                       id="nome"
                                       name="nome"
                                       maxlength="100"
                                       th:value="${nome}"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">E-mail</label>
                                <input class="form-control"
                                       id="email"
                                       name="email"
                                       type="email"
                                       maxlength="100"
                                       th:value="${email}"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="senha">Senha</label>
                                <input class="form-control"
                                       id="senha"
                                       name="senha"
                                       type="password"
                                       th:required="${not edicao}">
                                <div class="form-text text-muted" th:if="${edicao}">
                                    Deixe em branco para manter a mesma senha.
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit"
                                        th:text="${edicao ? 'Salvar alterações' : 'Cadastrar usuário'}">
                                </button>
                                <a class="btn btn-outline-secondary" href="/usuarios">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
