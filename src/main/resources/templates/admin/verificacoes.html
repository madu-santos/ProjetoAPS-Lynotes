<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Verificações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="sidebar">
        <h2>🎵 Lynotes Admin</h2>
        <a href="/artistas" class="btn btn-outline-light w-100 mb-3"><i class="fas fa-home"></i> Voltar ao App</a>
        <form action="/logout" method="post">
            <button type="submit" class="btn btn-danger w-100"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </form>
    </div>

    <div class="main-content">
        <div class="header d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 m-0 text-light"><i class="fas fa-check-circle"></i> Aprovação de Artistas Verificados</h1>
        </div>

        <div class="card bg-dark text-light border-secondary">
            <div class="card-body">
                <div th:if="${artistas.isEmpty()}" class="alert alert-info text-center" role="alert">
                    <i class="fas fa-info-circle fa-2x mb-2"></i><br>
                    Nenhuma solicitação de verificação pendente no momento.
                </div>

                <table class="table table-dark table-hover align-middle" th:unless="${artistas.isEmpty()}">
                    <thead>
                        <tr>
                            <th scope="col">Artista</th>
                            <th scope="col">Gênero</th>
                            <th scope="col">CPF / Nascimento</th>
                            <th scope="col">Endereço Completo</th>
                            <th scope="col" class="text-center">Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="artista : ${artistas}">
                            <td>
                                <strong th:text="${artista.nome}"></strong><br>
                                <small class="text-muted" th:text="${artista.biografia}"></small>
                            </td>
                            <td th:text="${artista.generoMusical}"></td>
                            <td>
                                <div><i class="fas fa-id-card"></i> <span th:text="${artista.cpf}"></span></div>
                                <div><i class="fas fa-calendar-alt"></i> <span th:text="${#temporals.format(artista.dataNascimento, 'dd/MM/yyyy')}"></span></div>
                            </td>
                            <td>
                                <div><span th:text="${artista.logradouro}"></span>, <span th:text="${artista.numero}"></span></div>
                                <div><span th:text="${artista.bairro}"></span> - <span th:text="${artista.cidade}"></span>/<span th:text="${artista.uf}"></span></div>
                                <div>CEP: <span th:text="${artista.cep}"></span></div>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <form th:action="@{/admin/verificacoes/{id}/aprovar(id=${artista.id})}" method="post">
                                        <button type="submit" class="btn btn-success btn-sm" title="Aprovar">
                                            <i class="fas fa-check"></i> Aprovar
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/verificacoes/{id}/rejeitar(id=${artista.id})}" method="post">
                                        <button type="submit" class="btn btn-danger btn-sm" title="Rejeitar">
                                            <i class="fas fa-times"></i> Rejeitar
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
