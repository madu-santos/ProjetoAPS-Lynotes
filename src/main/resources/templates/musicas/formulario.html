<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.edicao ? 'Editar música - Lynotes' : 'Nova música - Lynotes'}">
        Música - Lynotes
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/musicas">Lynotes</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/artistas">Artistas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/albums">Álbuns</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/musicas">Músicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/usuarios">Usuários</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a class="text-decoration-none" href="/musicas">&larr; Voltar para músicas</a>
                    <h1 class="mt-2" th:text="${form.edicao ? 'Editar música' : 'Nova música'}"></h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" th:action="${form.acao}">
                            <div class="mb-3">
                                <label class="form-label" for="titulo">Título</label>
                                <input class="form-control"
                                       id="titulo"
                                       name="titulo"
                                       maxlength="150"
                                       th:value="${form.titulo}"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="genero">Gênero</label>
                                <input class="form-control"
                                       id="genero"
                                       name="genero"
                                       maxlength="100"
                                       th:value="${form.genero}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="duracaoSegundos">Duração (segundos)</label>
                                <input class="form-control"
                                       id="duracaoSegundos"
                                       name="duracaoSegundos"
                                       type="number"
                                       min="1"
                                       th:value="${form.duracaoSegundos}"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="albumId">Álbum</label>
                                <select class="form-select" id="albumId" name="albumId">
                                    <option value="">-- Sem álbum (Single) --</option>
                                    <option th:each="album : ${form.albums}"
                                            th:value="${album.id}"
                                            th:text="${album.titulo}"
                                            th:selected="${form.albumId == album.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit"
                                        th:text="${form.edicao ? 'Salvar alterações' : 'Cadastrar música'}">
                                </button>
                                <a class="btn btn-outline-secondary" href="/musicas">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
