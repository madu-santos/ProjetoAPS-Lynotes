<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.edicao ? 'Editar mÃƒÂºsica - Lynotes' : 'Catalogar mÃƒÂºsica - Lynotes'}">
        MÃƒÂºsica - Lynotes
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('musicas')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a class="text-decoration-none" href="/">&larr; Voltar para o catÃƒÂ¡logo</a>
                    <h1 class="mt-2 fw-bold" th:text="${form.edicao ? 'Editar mÃƒÂºsica' : 'Catalogar mÃƒÂºsica'}"></h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                        <form method="post" th:action="${form.acao}">
                            <div class="mb-3">
                                <label class="form-label" for="titulo">Nome da mÃƒÂºsica</label>
                                <input class="form-control"
                                       id="titulo"
                                       name="titulo"
                                       maxlength="150"
                                       th:value="${form.titulo}"
                                       required
                                       autofocus
                                       placeholder="Ex: Chove Chuva">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="artista">Artista</label>
                                <input class="form-control"
                                       id="artista"
                                       name="artista"
                                       maxlength="150"
                                       th:value="${form.artista}"
                                       required
                                       placeholder="Ex: Jorge Ben">
                            </div>





                            <div class="mb-3">
                                <label class="form-label" for="youtubeUrl">URL do YouTube (Opcional)</label>
                                <input class="form-control"
                                       id="youtubeUrl"
                                       name="youtubeUrl"
                                       type="url"
                                       th:value="${form.youtubeUrl}"
                                       placeholder="https://www.youtube.com/watch?v=...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="playlistId">Salvar em playlist existente</label>
                                <div class="interactive-stars fs-2" data-input="nota-input" th:attr="data-initial=${form.nota}" style="cursor: pointer;">
                                    <i class="bi bi-star star-btn" data-index="1"></i>
                                    <i class="bi bi-star star-btn" data-index="2"></i>
                                    <i class="bi bi-star star-btn" data-index="3"></i>
                                    <i class="bi bi-star star-btn" data-index="4"></i>
                                    <i class="bi bi-star star-btn" data-index="5"></i>
                                </div>
                                <input type="hidden" name="nota" id="nota-input" th:value="${form.nota}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="novaPlaylistNome">Criar nova playlist</label>
                                <input class="form-control"
                                       id="novaPlaylistNome"
                                       name="novaPlaylistNome"
                                       type="text"
                                       th:value="${form.novaPlaylistNome}"
                                       placeholder="Nome da nova playlist">
                                <div class="form-text">Se estiver preenchendo a URL do YouTube, ela serÃƒÂ¡ adicionada automaticamente ÃƒÂ  playlist criada.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Nota (AvaliaÃƒÂ§ÃƒÂ£o)</label>
                                <div class="interactive-stars fs-2" data-input="nota-input" th:attr="data-initial=${form.nota}" style="cursor: pointer;">
                                    <i class="bi bi-star star-btn" data-index="1"></i>
                                    <i class="bi bi-star star-btn" data-index="2"></i>
                                    <i class="bi bi-star star-btn" data-index="3"></i>
                                    <i class="bi bi-star star-btn" data-index="4"></i>
                                    <i class="bi bi-star star-btn" data-index="5"></i>
                                </div>
                                <input type="hidden" name="nota" id="nota-input" th:value="${form.nota}">
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="resenha">Resenha Pessoal (Privada)</label>
                                <textarea class="form-control"
                                          id="resenha"
                                          name="resenha"
                                          rows="4"
                                          th:text="${form.resenha}"
                                          placeholder="AnotaÃƒÂ§ÃƒÂµes para vocÃƒÂª mesmo..."></textarea>
                            </div>

                            <div class="mb-4 p-3 rounded" style="background-color: #282828;">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="compartilharComunidade" name="compartilharComunidade" onchange="document.getElementById('twitterBox').classList.toggle('d-none', !this.checked)" checked>
                                    <label class="form-check-label fw-bold text-white" for="compartilharComunidade">Tweetar na Comunidade <i class="bi bi-chat-text ms-1"></i></label>
                                </div>
                                <div id="twitterBox" class="mt-2">
                                    <textarea class="form-control bg-dark text-white border-secondary" name="mensagemComunidade" maxlength="280" rows="3" placeholder="O que vocÃƒÂª achou dessa mÃƒÂºsica? Compartilhe com a galera..." oninput="document.getElementById('charCount').textContent = this.value.length"></textarea>
                                    <div class="form-text text-end text-secondary mt-1"><span id="charCount">0</span>/280</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary" type="submit"
                                        th:text="${form.edicao ? 'Salvar alteraÃƒÂ§ÃƒÂµes' : 'Catalogar mÃƒÂºsica'}">
                                </button>
                                <a class="btn btn-outline-secondary" href="/">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

</div>
<div th:insert="~{fragments/player :: bottom-player}"></div>
    
</body>
</html>
