<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Lista de Músicas</title>
</head>
<body>
    <section>
        <h1 class="mb-4">Lista de Músicas</h1>

        <a th:href="@{/musicas/new}" class="btn btn-primary mb-3">Nova Música</a>
        <a th:href="@{/albums}" class="btn btn-secondary mb-3 ms-2">Ver Álbuns</a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Gênero</th>
                    <th>Duração (segundos)</th>
                    <th>Álbum</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="musica : ${musicas}">
                    <td th:text="${musica.id}"></td>
                    <td th:text="${musica.titulo}"></td>
                    <td th:text="${musica.genero}"></td>
                    <td th:text="${musica.duracaoSegundos}"></td>
                    <td th:text="${musica.album != null ? musica.album.titulo : 'N/A'}"></td>
                    <td>
                        <a th:href="@{/musicas/edit/{id}(id=${musica.id})}" class="btn btn-info btn-sm">Editar</a>
                        <form th:action="@{/musicas/delete/{id}(id=${musica.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir esta música?');">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
