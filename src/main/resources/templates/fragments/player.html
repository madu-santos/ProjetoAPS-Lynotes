<div id="mini-player" th:fragment="player">
    <div class="player-header mb-2">
        <div>
            <h3 class="mb-1">Mini player</h3>
            <div class="text-secondary small">YouTube áudio</div>
        </div>
    </div>
    <div class="player-frame-holder">
        <div id="youtube-player"></div>
    </div>
    <div class="player-current-title mb-2" id="player-current-title">Nenhum item carregado</div>
    <div class="player-controls mb-3">
        <button class="btn btn-outline-primary btn-sm" type="button" onclick="playerPrev()">Anterior</button>
        <button class="btn btn-outline-primary btn-sm" type="button" onclick="playerPlayPause()">Play/Pause</button>
        <button class="btn btn-outline-primary btn-sm" type="button" onclick="playerNext()">Próximo</button>
    </div>

    <div class="mb-3">
        <label class="form-label small mb-1" for="player-playlist-select">Playlist</label>
        <select id="player-playlist-select" class="form-select" onchange="playerSelectPlaylist()">
            <option value="">Selecione uma playlist</option>
        </select>
    </div>

    <button class="btn btn-outline-light btn-sm w-100 mb-3" type="button" onclick="playerLoadFromSelectedPlaylist()">Carregar playlist</button>
    <div class="player-message" id="player-message"></div>
    <div class="player-track-list" id="player-track-list"></div>
</div>
