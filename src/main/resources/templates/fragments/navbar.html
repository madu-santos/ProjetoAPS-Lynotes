<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
    <nav th:fragment="navbar(paginaAtiva)" class="navbar navbar-expand-md custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-purple" href="/" hx-boost="false">Lynotes</a>
            <ul class="navbar-nav me-auto mb-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${paginaAtiva == 'catalogo'} ? 'active' : ''" href="/">Meu Catálogo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${paginaAtiva == 'musicas'} ? 'active' : ''" href="/musicas">Músicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${paginaAtiva == 'artistas'} ? 'active' : ''" href="/artistas">Artistas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${paginaAtiva == 'albums'} ? 'active' : ''" href="/albums">Álbuns</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${paginaAtiva == 'playlists'} ? 'active' : ''" href="/playlists">Playlists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${paginaAtiva == 'comunidade'} ? 'active' : ''" href="/comunidade">Comunidade</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2" th:if="${usuarioLogado != null}">
                <a class="navbar-profile-btn text-decoration-none" href="/usuarios/me">Acessar perfil</a>
                <form method="post" action="/logout" hx-boost="false" class="m-0">
                    <button class="navbar-logout-btn" type="submit">Sair</button>
                </form>
            </div>
        </div>
    </nav>
</body>
</html>
