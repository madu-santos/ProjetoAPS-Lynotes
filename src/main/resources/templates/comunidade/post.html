<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('comunidade')}"></div>

    <main class="container py-5">
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-4">
                    <a href="/comunidade" class="text-decoration-none">&larr; Voltar para a Comunidade</a>
                </div>
                
                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
                
                <!-- Post Principal -->
                <div class="card community-post-card shadow-sm mb-4 border-primary">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle me-3" th:text="${#strings.substring(post.usuarioNome, 0, 1).toUpperCase()}">U</div>
                                <div>
                                    <a th:href="@{'/usuarios/' + ${post.usuarioId}}" class="text-decoration-none fw-bold post-user-link fs-4" th:text="${post.usuarioNome}"></a>
                                    <div class="text-muted small" th:text="${#temporals.format(post.dataCriacao, 'dd/MM/yyyy HH:mm')}"></div>
                                </div>
                            </div>
                            <div class="d-flex gap-1" th:if="${usuarioLogadoId == post.usuarioId}">
                                <button th:if="${post.qtdComentarios == 0}" class="btn btn-sm btn-outline-secondary border-0 text-white-50" type="button" data-bs-toggle="collapse" th:data-bs-target="'#editPost' + ${post.id}" title="Editar post">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
                                        <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                                    </svg>
                                </button>
                                <form th:action="@{'/comunidade/post/' + ${post.id} + '/excluir'}" method="post" hx-boost="false" onsubmit="return confirm('Tem certeza que deseja excluir este post?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger border-0 text-danger" title="Excluir post">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                        </svg>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <p class="card-text mb-4 fs-5 text-break" style="white-space: pre-wrap; color: #e1e1e1;" th:text="${post.conteudo}"></p>
                        
                        <div class="collapse mb-4" th:id="'editPost' + ${post.id}">
                            <div class="card card-body bg-dark border-secondary">
                                <form th:action="@{'/comunidade/post/' + ${post.id} + '/editar'}" method="post" hx-boost="false">
                                    <textarea class="form-control post-textarea mb-2" name="conteudo" rows="3" required maxlength="500" th:text="${post.conteudo}"></textarea>
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" th:data-bs-target="'#editPost' + ${post.id}">Cancelar</button>
                                        <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-3 border-top pt-3">
                            <form th:action="@{'/comunidade/post/' + ${post.id} + '/estrela'}" method="post" hx-boost="false">
                                <button type="submit" class="btn btn-sm d-flex align-items-center gap-1" th:classappend="${post.estreladoPorMim} ? 'btn-warning text-dark fw-bold' : 'btn-outline-secondary'">
                                    <span th:text="${post.estreladoPorMim} ? '★' : '☆'"></span>
                                    <span th:text="${post.qtdEstrelas}"></span>
                                </button>
                            </form>
                            <span class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2 disabled">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-chat-text" viewBox="0 0 16 16">
                                    <path d="M2.678 11.894a1 1 0 0 1 .287.801 11 11 0 0 1-.398 2c1.395-.323 2.247-.697 2.634-.893a1 1 0 0 1 .71-.074A8 8 0 0 0 8 14c3.996 0 7-2.807 7-6s-3.004-6-7-6-7 2.808-7 6c0 1.468.617 2.83 1.678 3.894m-.493 3.905a21.682 21.682 0 0 1-.713.129c-.2.032-.352-.176-.273-.362a10 10 0 0 0 .244-.637l.003-.01c.248-.72.45-1.548.524-2.319C.743 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.52.263-1.639.742-3.468 1.105z"/>
                                    <path d="M4 5.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8m0 2.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5"/>
                                </svg>
                                <span th:text="${post.qtdComentarios}"></span>
                            </span>
                        </div>
                    </div>
                </div>
                
                <!-- Formulário de Comentário -->
                <div class="card shadow-sm mb-5 bg-dark border-secondary">
                    <div class="card-body">
                        <form th:action="@{'/comunidade/post/' + ${post.id} + '/comentar'}" method="post" hx-boost="false">
                            <div class="mb-3">
                                <textarea class="form-control post-textarea" name="conteudo" rows="2" placeholder="Escreva seu comentário..." required maxlength="500"></textarea>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary btn-sm px-4">Comentar</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Lista de Comentários -->
                <h5 class="fw-bold mb-4">Comentários</h5>
                
                <div th:if="${comentarios.isEmpty()}" class="text-muted text-center py-4">
                    Seja o primeiro a comentar neste post!
                </div>
                
                <div class="card community-post-card shadow-sm mb-3" th:each="comentario : ${comentarios}">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle me-3" style="width: 38px; height: 38px; font-size: 1rem;" th:text="${#strings.substring(comentario.usuarioNome, 0, 1).toUpperCase()}">U</div>
                                <div>
                                    <a th:href="@{'/usuarios/' + ${comentario.usuarioId}}" class="text-decoration-none fw-bold post-user-link" th:text="${comentario.usuarioNome}"></a>
                                    <div class="text-muted small" th:text="${#temporals.format(comentario.dataCriacao, 'dd/MM/yyyy HH:mm')}"></div>
                                </div>
                            </div>
                            <div th:if="${usuarioLogadoId == comentario.usuarioId}">
                                <form th:action="@{'/comunidade/comentario/' + ${comentario.id} + '/excluir'}" method="post" hx-boost="false" onsubmit="return confirm('Tem certeza que deseja excluir este comentário?');">
                                    <input type="hidden" name="postId" th:value="${post.id}" />
                                    <button type="submit" class="btn btn-sm text-danger border-0 p-0" title="Excluir comentário">
                                        <small>Excluir</small>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <p class="card-text mb-0 text-break" style="color: #e1e1e1;" th:text="${comentario.conteudo}"></p>
                    </div>
                </div>
                
            </div>
        </div>
        
    </main>

</div>
<div th:insert="fragments/player :: player"></div>
    <script src="/js/player.js" defer></script>
</body>
</html>
