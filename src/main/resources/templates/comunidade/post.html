<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('comunidade')}"></div>

    <main class="container py-5">
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-4">
                    <a href="/comunidade" class="text-decoration-none">&larr; Voltar para a Comunidade</a>
                </div>
                
                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
                
                <!-- Post Principal -->
                <div class="card shadow-sm mb-4 border-primary">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <a th:href="@{'/usuarios/' + ${post.usuarioId}}" class="text-decoration-none fw-bold text-dark fs-4" th:text="${post.usuarioNome}"></a>
                                <div class="text-muted small" th:text="${#temporals.format(post.dataCriacao, 'dd/MM/yyyy HH:mm')}"></div>
                            </div>
                        </div>
                        <p class="card-text mb-4 fs-5" th:text="${post.conteudo}"></p>
                        
                        <div class="d-flex gap-3 border-top pt-3">
                            <form th:action="@{'/comunidade/post/' + ${post.id} + '/estrela'}" method="post" hx-boost="false">
                                <button type="submit" class="btn btn-sm d-flex align-items-center gap-1" th:classappend="${post.estreladoPorMim} ? 'btn-warning text-dark fw-bold' : 'btn-outline-secondary'">
                                    <span th:text="${post.estreladoPorMim} ? '★' : '☆'"></span>
                                    <span th:text="${post.qtdEstrelas}"></span>
                                </button>
                            </form>
                            <span class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1 disabled">
                                💬 <span th:text="${post.qtdComentarios}"></span>
                            </span>
                        </div>
                    </div>
                </div>
                
                <!-- Formulário de Comentário -->
                <div class="card shadow-sm mb-5 bg-light">
                    <div class="card-body">
                        <form th:action="@{'/comunidade/post/' + ${post.id} + '/comentar'}" method="post" hx-boost="false">
                            <div class="mb-3">
                                <textarea class="form-control" name="conteudo" rows="2" placeholder="Escreva seu comentário..." required maxlength="500"></textarea>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary btn-sm px-4">Comentar</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Lista de Comentários -->
                <h5 class="fw-bold mb-4">Comentários</h5>
                
                <div th:if="${comentarios.isEmpty()}" class="text-muted text-center py-4">
                    Seja o primeiro a comentar neste post!
                </div>
                
                <div class="card shadow-sm mb-3" th:each="comentario : ${comentarios}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <a th:href="@{'/usuarios/' + ${comentario.usuarioId}}" class="text-decoration-none fw-bold text-dark" th:text="${comentario.usuarioNome}"></a>
                                <span class="text-muted small ms-2" th:text="${#temporals.format(comentario.dataCriacao, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>
                        </div>
                        <p class="card-text mb-0" th:text="${comentario.conteudo}"></p>
                    </div>
                </div>
                
            </div>
        </div>
        
    </main>

</div>
<div th:insert="fragments/player :: player"></div>
    <script src="/js/player.js" defer></script>
</body>
</html>
